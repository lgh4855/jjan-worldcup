<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>짠! 월드컵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="home">
  <header class="hero">
    <div>
      <h1>짠! 월드컵</h1>
      <p>둘 중 하나만 살아남는다. 술자리에서 다 같이 "하나, 둘, 셋!" 하고 동시에 가리키고, 소수파는 한 잔.</p>
    </div>
    <svg viewBox="0 0 120 220" aria-hidden="true">
      <rect x="44" y="6" width="32" height="20" rx="4" fill="#0b5a37"/>
      <path d="M48 26h24v34c0 10 22 20 22 44v100c0 8-6 12-14 12H40c-8 0-14-4-14-12V104c0-24 22-34 22-44z" fill="#16975d"/>
      <path d="M48 26h8v34c0 10-22 20-22 44v100c0 6 2 10 8 11-6 0-12-4-12-11V104c0-24 18-34 18-44z" fill="#ffffff44"/>
      <rect x="26" y="118" width="68" height="60" fill="#fff"/>
      <text x="60" y="156" text-anchor="middle" font-family="Black Han Sans" font-size="26" fill="#0f7a4a">짠!</text>
      <circle cx="98" cy="40" r="8" fill="#ffd23f"/><circle cx="14" cy="70" r="5" fill="#ffd23f"/>
    </svg>
  </header>
  <div class="tent"></div>
  <div class="bar">
    <label class="party"><input type="checkbox" id="partyT"> <span>술자리 모드<small>카운트다운 · 소수파 벌주 · 랜덤 미션</small></span></label>
    <span style="color:var(--mute);font-size:14px" id="cnt"></span>
  </div>
  <h2 class="sect">폰 여러 대로 같이 하기</h2>
  <div class="modes">
    <a class="mode s" href="sync.html"><span class="em">📺</span><h3>방장 화면 공유</h3><p>방장이 고르면 모두의 폰이 같이 넘어가요</p></a>
    <a class="mode v" href="vote.html"><span class="em">🗳️</span><h3>다 같이 투표</h3><p>각자 몰래 투표 → 공개! 소수파 이름이 불려요</p></a>
  </div>
  <h2 class="sect">폰 하나로 하기</h2>
  <main class="grid" id="grid"></main>
  <footer>후보는 텍스트와 이모지로 되어 있어요. "나만의 월드컵"에서 친구들 사진이나 원하는 후보로 직접 만들 수 있어요.</footer>
</div>

<section id="play" class="hide">
  <div>
    <div class="top">
      <button id="quit" aria-label="처음으로">✕ 그만</button>
      <h2 id="rlabel"></h2>
      <button id="undo">↶ 되돌리기</button>
    </div>
    <div class="prog"><i id="pbar"></i></div>
  </div>
  <div class="arena" id="arena"></div>
  <div class="foot" id="foot"><button class="btn go" id="cdBtn">하나, 둘, 셋! 🍻</button></div>
</section>

<section id="result" class="hide"></section>
<div id="ov" class="ov hide"></div>

<script src="data.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let party=store.get('jjan-party',true),S=null,hist=[],busy=false,custom=null;
$('#partyT').checked=party;
$('#partyT').onchange=e=>{party=e.target.checked;store.set('jjan-party',party)};
$('#cnt').textContent=`월드컵 ${GENRES.length}종 · 후보 ${GENRES.reduce((a,g)=>a+g.items.length,0)}개`;

$('#grid').innerHTML=GENRES.map(g=>`<button class="g" style="--h:${g.h}" data-id="${g.id}">
 <span class="n">${g.items.length}강</span><span class="em">${g.e}</span><h3>${esc(g.t)}</h3><p>${esc(g.d)}</p></button>`).join('')
 +`<button class="g custom" data-id="custom"><span class="em">✏️</span><h3>나만의 월드컵</h3><p>후보를 직접 적거나 친구들 사진을 넣어서</p></button>`;
$('#grid').onclick=e=>{const b=e.target.closest('.g');if(!b)return;b.dataset.id==='custom'?openCustom():pickSize(GENRES.find(g=>g.id===b.dataset.id))};

function sizesFor(n){const r=[];for(let s=4;s<=n;s*=2)r.push(s);return r.slice(-3)}
function pickSize(g){
 const ss=sizesFor(g.items.length);
 modal(`<h2>${g.e} ${esc(g.t)}</h2><p>${esc(g.d)} — 몇 강으로 할까요?</p>
 <div class="sizes">${ss.map(s=>`<button data-s="${s}">${s===4?'4강':s+'강'}</button>`).join('')}</div>
 <p style="font-size:14px">후보는 매번 무작위로 섞여요.${party?' 술자리 모드 켜짐 🍻':''}</p>
 <button class="btn alt" data-x>취소</button>`,b=>{if(b.dataset.s)start(g,+b.dataset.s)});
}
function modal(html,on){const o=$('#ov');o.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;o.classList.remove('hide');
 o.onclick=e=>{if(e.target===o||e.target.closest('[data-x]'))return close();const b=e.target.closest('button');if(b&&on&&on(b)!==false)close()};
 o.querySelector('button')?.focus()}
function close(){$('#ov').classList.add('hide');$('#ov').innerHTML=''}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(g,size){
 S={g,size,round:shuffle(g.items).slice(0,size),next:[],i:0,log:[],done:0,total:size-1};hist=[];
 $('#home').classList.add('hide');$('#result').classList.add('hide');$('#play').classList.remove('hide');render()}
const rname=n=>n===2?'결승':n===4?'준결승':n+'강';
function card(it,k){return `<button class="c" data-k="${k}">${it.img?`<img src="${it.img}" alt="">`:`<span class="em">${esc(it.e)}</span>`}<span class="nm">${esc(it.n)}</span></button>`}
function render(){
 const r=S.round,a=r[S.i],b=r[S.i+1];
 $('#rlabel').textContent=`${S.g.t.replace(' 월드컵','')} · ${rname(r.length)}${r.length>2?` ${S.i/2+1}/${r.length/2}`:''}`;
 $('#pbar').style.width=(S.done/S.total*100)+'%';
 $('#arena').innerHTML=card(a,0)+card(b,1)+'<div class="vs">VS</div>';
 $('#undo').disabled=!hist.length;
 $('#foot').classList.toggle('hide',!party);busy=false}
$('#arena').onclick=e=>{const c=e.target.closest('.c');if(!c||busy)return;choose(+c.dataset.k)};
document.addEventListener('keydown',e=>{if($('#play').classList.contains('hide')||!$('#ov').classList.contains('hide')||busy)return;
 if(e.key==='ArrowLeft'||e.key==='ArrowUp')choose(0);if(e.key==='ArrowRight'||e.key==='ArrowDown')choose(1)});
function choose(k){
 busy=true;hist.push(JSON.stringify({...S,g:null}));
 const cs=[...document.querySelectorAll('.c')];cs[k].classList.add('win');cs[1-k].classList.add('lose');
 const w=S.round[S.i+k],l=S.round[S.i+1-k];
 S.log.push({r:rname(S.round.length),w,l});S.next.push(w);S.i+=2;S.done++;
 if(party)toast(`"${l.n}" 가리킨 사람 한 잔! 🍶`);
 setTimeout(()=>{
  if(S.i>=S.round.length){if(S.next.length===1)return finish();S.round=S.next;S.next=[];S.i=0}
  render();
  if(party&&S.done%5===0&&Math.random()<.75)mission();
 },650)}
$('#undo').onclick=()=>{if(!hist.length)return;const g=S.g;S=JSON.parse(hist.pop());S.g=g;render()};
$('#quit').onclick=()=>modal(`<h2>그만할까요?</h2><p>진행 중인 월드컵은 사라져요.</p><div class="acts"><button class="btn" data-q>처음으로</button><button class="btn alt" data-x>계속하기</button></div>`,b=>{if(b.hasAttribute('data-q'))home()});
function home(){$('#play').classList.add('hide');$('#result').classList.add('hide');$('#home').classList.remove('hide');S=null}
let tt;function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);clearTimeout(tt);tt=setTimeout(()=>d.remove(),2200)}
function mission(){const m=MISSIONS[Math.random()*MISSIONS.length|0];
 modal(`<span class="tag">🃏 랜덤 미션 카드</span><p>${esc(m)}</p><button class="btn go" data-x>완료!</button>`);
 $('#ov .box').classList.add('mission')}
$('#cdBtn').onclick=()=>{const o=$('#ov');o.classList.remove('hide');o.onclick=null;
 const words=['하나','둘','셋!'];let i=0;
 const step=()=>{o.innerHTML=`<div class="count" style="font-size:clamp(80px,22vw,200px)">${words[i]}</div>`;if(++i<3)setTimeout(step,650);else setTimeout(()=>{o.innerHTML=`<div class="count" style="font-size:clamp(44px,11vw,100px)">동시에 가리켜! 👉</div>`;setTimeout(close,1000)},650)};step()};

function finish(){
 const w=S.next[0],g=S.g,key='jjan-rank-'+g.id,rk=store.get(key,{});
 const second=S.log[S.log.length-1].l;
 if(g.id!=='custom'){rk[w.n]=(rk[w.n]||0)+1;store.set(key,rk)}
 const path=S.log.filter(x=>x.w===w||x.w.n===w.n&&x.w.e===w.e);
 const top=Object.entries(rk).sort((a,b)=>b[1]-a[1]).slice(0,8),max=top[0]?.[1]||1;
 const res=$('#result');
 res.innerHTML=`<div class="crown"><div class="sub">${esc(g.t)} ${S.size}강 우승</div>
 ${w.img?`<img src="${w.img}" alt="">`:`<div class="em">${esc(w.e)}</div>`}<h2>${esc(w.n)}</h2>
 <p style="margin:8px 0 0">준우승 ${esc(second.e||'')} ${esc(second.n)}${party?' · 우승 맞춘 사람 벌주 면제, 나머지 다 같이 짠! 🍻':''}</p></div>
 <div class="tent" style="background:repeating-linear-gradient(90deg,var(--tent) 0 48px,var(--bg) 48px 96px);rotate:180deg"></div>
 <div class="res">
  <div class="acts"><button class="btn go" id="again">다시 하기</button><button class="btn alt" id="other">다른 월드컵</button><button class="btn alt" id="copy">결과 복사</button></div>
  <div><h3>우승까지의 길</h3><ol class="path">${path.map(x=>`<li><b>${x.r}</b><span>${esc(x.l.e||'')} ${esc(x.l.n)} 꺾음</span></li>`).join('')}</ol></div>
  ${top.length?`<div><h3>이 기기 누적 우승 랭킹</h3><div class="rank">${top.map(([n,c],i)=>`<div><b>${i+1}</b><span>${esc(n)}</span><i style="width:${c/max*100}%"></i><em>${c}회</em></div>`).join('')}</div></div>`:''}
 </div>`;
 $('#play').classList.add('hide');res.classList.remove('hide');res.scrollTop=0;
 $('#again').onclick=()=>start(g,S.size);$('#other').onclick=home;
 $('#copy').onclick=async e=>{const t=`🏆 ${g.t} ${S.size}강 우승: ${w.n}\n준우승: ${second.n}\n${path.map(x=>`${x.r} — ${x.l.n} 꺾음`).join('\n')}`;
  try{await navigator.clipboard.writeText(t);e.target.textContent='복사됨 ✓'}catch{e.target.textContent='복사 실패'}};
}

function openCustom(){
 modal(`<h2>✏️ 나만의 월드컵</h2>
 <input type="text" id="cT" placeholder="제목 (예: 우리 과 최고의 MT 장소)" value="${esc(custom?.t||'')}">
 <p>후보를 한 줄에 하나씩 적어 주세요. 맨 앞에 이모지를 붙이면 그림으로 나와요. 최소 4개.</p>
 <textarea id="cL" placeholder="🍜 학교 앞 라면집&#10;🍗 치킨집&#10;🍺 호프집&#10;🍢 포장마차">${esc(custom?.raw||'')}</textarea>
 <label class="file">📷 사진으로 후보 추가 (파일 이름이 후보 이름이 돼요)<input type="file" id="cF" accept="image/*" multiple></label>
 <p id="cInfo"></p>
 <div class="acts"><button class="btn go" data-go>시작하기</button><button class="btn alt" data-x>취소</button></div>`,b=>{
  if(!b.hasAttribute('data-go'))return;
  const raw=$('#cL').value,lines=raw.split('\n').map(s=>s.trim()).filter(Boolean);
  const items=lines.map(s=>{const m=s.match(/^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)\s*(.+)$/u);return m?{e:m[1],n:m[2]}:{e:'⭐',n:s}}).concat(photos);
  if(items.length<4){$('#cInfo').textContent='후보가 4개 이상 필요해요.';$('#cInfo').className='err';return false}
  custom={t:$('#cT').value.trim()||'나만의 월드컵',raw};store.set('jjan-custom',{t:custom.t,raw});
  const g={id:'custom',t:custom.t,d:'',e:'✏️',items};
  setTimeout(()=>pickSize(g),0)});
 let photos=[];
 $('#cF').onchange=e=>{photos=[...e.target.files].map(f=>({e:'',n:f.name.replace(/\.[^.]+$/,''),img:URL.createObjectURL(f)}));$('#cInfo').textContent=`사진 ${photos.length}장 추가됨`;$('#cInfo').className=''};
}
custom=store.get('jjan-custom',null);
}
</script>
</body>
</html>
