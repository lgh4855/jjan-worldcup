<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사진 출처 · 짠! 월드컵</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.cr{max-width:860px;margin:auto;padding:16px max(5vw,16px) 48px}
.cr h2{font-size:26px;margin:24px 0 10px}
.cr table{width:100%;border-collapse:collapse;font-size:14px}
.cr th,.cr td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.cr td a{color:var(--tent);overflow-wrap:anywhere}
</style>
</head>
<body>
<header class="hero mini"><div><a class="back" href="./">← 짠! 월드컵 홈</a><h1>📷 사진 출처</h1><p>후보 사진은 위키미디어 공용(Wikimedia Commons)에서 자유 라이선스로 공개된 사진을 작게 줄여서 썼어요.</p></div></header>
<div class="tent"></div>
<main class="cr" id="cr"></main>
<script src="data.js"></script>
<script src="img/credits.js"></script>
<script>
{
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('cr').innerHTML=Object.entries(CREDITS).map(([gid,items])=>{
 const g=GENRES.find(x=>x.id===gid);
 return `<h2>${esc(g?g.e+' '+g.t:gid)}</h2><table class="stack"><thead><tr><th>후보</th><th>작가</th><th>라이선스</th><th>원본</th></tr></thead><tbody>${
  Object.entries(items).map(([n,c])=>`<tr><td>${esc(n)}</td><td>${esc(c.by||'—')}</td><td>${esc(c.lic)}</td><td><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.t)}</a></td></tr>`).join('')}</tbody></table>`}).join('');
}
</script>
</body>
</html>
